<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE EARTH | Global Monitoring</title>

<link rel="stylesheet"
href="https://unpkg.com/maplibre-gl@6.17.0/dist/maplibre-gl.css">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050a12;
  color: #eaf4ff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#map {
  position: absolute;
  inset: 0;
}

.topbar {
  position: absolute;
  z-index: 5;
  top: 15px;
  left: 15px;
  right: 15px;
  min-height: 65px;
  background: rgba(5,12,24,.94);
  border: 1px solid #19344c;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  gap: 10px;
}

.logo {
  font-size: 21px;
  font-weight: bold;
  letter-spacing: 2px;
}

.logo span {
  color: #00c8ff;
}

.status {
  color: #53e6a1;
  font-size: 11px;
}

.panel {
  position: absolute;
  z-index: 5;
  top: 100px;
  left: 15px;
  width: 250px;
  padding: 17px;
  background: rgba(5,12,24,.94);
  border: 1px solid #19344c;
  border-radius: 12px;
}

.panel h3 {
  font-size: 13px;
  color: #00c8ff;
  letter-spacing: 1px;
  margin-top: 0;
}

.layer {
  padding: 12px 0;
  border-bottom: 1px solid #183044;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
}

.pending {
  color: #8296a9;
  font-size: 10px;
}

.bottom {
  position: absolute;
  z-index: 5;
  bottom: 15px;
  left: 15px;
  right: 15px;
  padding: 14px;
  background: rgba(5,12,24,.94);
  border: 1px solid #19344c;
  border-radius: 12px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 11px;
}

button {
  background: #10273c;
  border: 1px solid #24516f;
  color: white;
  border-radius: 6px;
  padding: 9px 13px;
  cursor: pointer;
}

button:hover {
  background: #075078;
}

#loading {
  position: absolute;
  z-index: 10;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  background: #071321;
  padding: 18px 25px;
  border-radius: 10px;
  border: 1px solid #00c8ff;
  text-align: center;
}

@media(max-width:600px) {
  .panel {
    width: 185px;
    top: 90px;
    padding: 12px;
  }

  .logo {
    font-size: 16px;
  }

  .status {
    font-size: 9px;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<div id="loading">INITIALIZING LIVE EARTH...</div>

<header class="topbar">
  <div class="logo">🌍 LIVE <span>EARTH</span></div>
  <div class="status">● GLOBE INITIALIZING</div>
</header>

<aside class="panel">
  <h3>GLOBAL DATA LAYERS</h3>

  <div class="layer">
    ✈ Aircraft
    <span class="pending">PENDING</span>
  </div>

  <div class="layer">
    🚢 Ships
    <span class="pending">PENDING</span>
  </div>

  <div class="layer">
    🚗 Traffic
    <span class="pending">PENDING</span>
  </div>

  <div class="layer">
    🛰 Satellites
    <span class="pending">PENDING</span>
  </div>

  <div class="layer">
    🌦 Weather
    <span class="pending">PENDING</span>
  </div>

  <div class="layer">
    🚶 Human activity
    <span class="pending">PENDING</span>
  </div>
</aside>

<footer class="bottom">
  <div>🌐 GLOBAL VIEW</div>
  <div>DATA FEEDS: NOT CONNECTED YET</div>
  <div>
    <button id="zoomIn">+</button>
    <button id="zoomOut">−</button>
    <button id="reset">RESET GLOBE</button>
    <button id="fullscreen">FULLSCREEN</button>
  </div>
</footer>

<script type="module">
import * as maplibregl from
"https://unpkg.com/maplibre-gl@6.17.0/dist/maplibre-gl.mjs";

const map = new maplibregl.Map({
  container: "map",
  style: "https://demotiles.maplibre.org/globe.json",
  center: [0, 20],
  zoom: 1.5,
  pitch: 0,
  bearing: 0
});

map.addControl(
  new maplibregl.NavigationControl(),
  "bottom-right"
);

map.on("load", () => {
  map.setProjection({type: "globe"});

  document.getElementById("loading").style.display = "none";

  document.querySelector(".status").textContent =
    "● GLOBE ONLINE";
});

map.on("error", (event) => {
  console.error("LIVE EARTH MAP ERROR:", event.error);
});

document.getElementById("zoomIn").onclick = () => {
  map.zoomIn();
};

document.getElementById("zoomOut").onclick = () => {
  map.zoomOut();
};

document.getElementById("reset").onclick = () => {
  map.flyTo({
    center: [0, 20],
    zoom: 1.5,
    pitch: 0,
    bearing: 0,
    duration: 1500
  });
};

document.getElementById("fullscreen").onclick = () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
};
</script>

</body>
</html>
